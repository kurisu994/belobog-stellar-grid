name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "补发已有版本标签（如 v1.1.10）；留空仅执行检查"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 手动补发使用当前工作流，但所有源码与产物必须来自指定的已有标签。
  resolve-release:
    name: 确定验证与发布版本
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验标签并固定源码提交
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=""
          publish=false
          source_sha="$WORKFLOW_SHA"
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == refs/tags/v* ]]; then
            tag="${EVENT_REF#refs/tags/}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_RELEASE_TAG"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "错误：必须指定版本标签，例如 v1.1.10"
              exit 1
            fi
            source_sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            publish=true
          fi
          version=$(git show "$source_sha:Cargo.toml" | python3 -c 'import sys,tomllib; print(tomllib.load(sys.stdin.buffer)["package"]["version"])')
          if [[ "$publish" == true && "$tag" != "v$version" ]]; then
            echo "错误：标签 $tag 与源码版本 $version 不一致"
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "源码提交：${source_sha}；版本：${version}；执行 npm 发布：${publish}"

  # 代码质量检查
  check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    needs: resolve-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 检查代码格式
        run: cargo fmt -- --check

      - name: 运行 Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --locked --verbose

  # 保留声明的最低 Rust 版本，避免 stable 掩盖兼容性回退
  msrv:
    name: Rust 1.85 兼容性
    runs-on: ubuntu-latest
    needs: resolve-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --lib
      - run: cargo check --locked --lib --target wasm32-unknown-unknown

  # WebAssembly 构建
  build-wasm:
    name: WebAssembly 构建
    runs-on: ubuntu-latest
    needs: [resolve-release, check, msrv]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 安装 wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 编译 WASM 测试
        run: cargo check --locked --target wasm32-unknown-unknown --tests --verbose

      - name: 执行 JS 数据与选项回归测试
        run: wasm-pack test --node . --locked --lib --test test_data_regressions --test test_options_regressions

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true

      - name: 执行真实 DOM 回归测试
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/webdriver.json
        run: |
          # 显式绑定配套浏览器，避免 ChromeDriver 自动选中 runner 自带的旧版 Chrome。
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.WASM_BINDGEN_TEST_WEBDRIVER_JSON, JSON.stringify({
            'goog:chromeOptions': { binary: process.env.CHROME_BINARY },
          }));
          NODE
          wasm-pack test --headless --chrome --chromedriver "${{ steps.chrome.outputs.chromedriver-path }}" . --locked --test test_dom_regressions

      - name: 构建 WebAssembly 包
        run: wasm-pack build --target web --release

      - name: 检查包大小
        run: |
          echo "WebAssembly 文件大小:"
          ls -lh pkg/belobog_stellar_grid_bg.wasm

          PACKAGE_SIZE=$(stat -c%s pkg/belobog_stellar_grid_bg.wasm)
          echo "包大小: ${PACKAGE_SIZE} bytes"

          # WASM 文件大小限制调整为 2MB（包含 xlsx 支持后体积增大）
          if [ $PACKAGE_SIZE -gt 2048000 ]; then
            echo "⚠️ 警告: 包大小超过 2MB"
          else
            echo "✅ 包大小合理"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: pkg/
          retention-days: 30

  # 使用实际示例页和下载文件内容作为发布门禁
  browser-test:
    name: 浏览器测试
    runs-on: ubuntu-latest
    needs: [resolve-release, build-wasm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装静态服务器和浏览器测试依赖
        run: |
          cargo install basic-http-server --locked
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: 执行浏览器 E2E
        run: pnpm --dir e2e exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  packages-check:
    name: 框架子包构建与回归
    runs-on: ubuntu-latest
    needs: [resolve-release, build-wasm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建所有子包
        run: |
          for package in types react vue svelte solid worker; do
            pnpm --dir "packages/$package" install --frozen-lockfile
            pnpm --dir "packages/$package" run build
          done
      - name: 验证预览生命周期、类型与发布产物
        run: node --test packages/scripts/*.test.mjs

  # 发布到 npm
  publish-npm:
    name: 发布到 npm
    runs-on: ubuntu-latest
    needs: [resolve-release, check, build-wasm, browser-test, packages-check]
    if: needs.resolve-release.outputs.publish == 'true'
    concurrency:
      group: npm-publish-${{ needs.resolve-release.outputs.tag }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: 下载 WebAssembly 包
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 检查版本并准备全部发布包
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const directories = ['pkg', ...['types', 'react', 'vue', 'svelte', 'solid', 'worker'].map(name => `packages/${name}`)];
          for (const directory of directories) {
            const manifest = JSON.parse(readFileSync(`${directory}/package.json`, 'utf8'));
            if (manifest.version !== process.env.RELEASE_VERSION) {
              throw new Error(`${directory} 版本与标签版本不一致`);
            }
          }
          NODE
          for package in types react vue svelte solid worker; do
            pnpm --dir "packages/$package" install --frozen-lockfile
            pnpm --dir "packages/$package" run build
          done
          node packages/scripts/prepare-publish.mjs "$RUNNER_TEMP/bsg-packages"

      - name: 发布缺失的 npm 版本
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGING_DIR: ${{ runner.temp }}/bsg-packages
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          if (!process.env.NODE_AUTH_TOKEN) throw new Error('未配置 NPM_TOKEN');
          const directories = ['pkg', ...['types', 'react', 'vue', 'svelte', 'solid', 'worker'].map(name => `${process.env.STAGING_DIR}/${name}`)];
          for (const directory of directories) {
            const { name, version } = JSON.parse(readFileSync(`${directory}/package.json`, 'utf8'));
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
              signal: AbortSignal.timeout(30000),
            });
            if (response.ok) {
              const published = await response.json();
              if (published.name !== name || published.version !== version) throw new Error(`${name} 的 registry 元数据不匹配`);
              console.log(`已存在，跳过 ${name}@${version}`);
              continue;
            }
            // 只有明确的 404 才表示版本缺失，鉴权或网络错误不能当成未发布。
            if (response.status !== 404) throw new Error(`查询 ${name}@${version} 失败：HTTP ${response.status}`);
            console.log(`正在发布 ${name}@${version}`);
            const result = spawnSync('pnpm', ['publish', '--access', 'public', '--no-git-checks', '--registry', 'https://registry.npmjs.org/'], {
              cwd: directory,
              stdio: 'inherit',
            });
            if (result.status !== 0) throw new Error(`发布 ${name}@${version} 失败`);
          }
          NODE

      - name: 发布成功通知
        env:
          RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          echo "npm 主包与六子包的 $RELEASE_VERSION 版本发布处理完成"
          echo "https://www.npmjs.com/package/belobog-stellar-grid"

  # 创建 GitHub Release
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve-release, check, build-wasm, browser-test, packages-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 版本号: $VERSION"

      - name: 从 CHANGELOG.md 提取发布说明
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取对应版本的内容（两个 ## [ 标题之间，或到文件末尾）
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "⚠️ 未在 CHANGELOG.md 中找到版本 $VERSION 的记录，使用默认说明"
            NOTES="发布版本 v${VERSION}"
          fi

          # 写入多行输出
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            pkg/belobog_stellar_grid_bg.wasm
            pkg/belobog_stellar_grid.js
            pkg/belobog_stellar_grid.d.ts
