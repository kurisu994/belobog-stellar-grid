name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 代码质量检查
  check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 检查代码格式
        run: cargo fmt -- --check

      - name: 运行 Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 运行测试
        run: cargo test --locked --verbose

  # 保留声明的最低 Rust 版本，避免 stable 掩盖兼容性回退
  msrv:
    name: Rust 1.85 兼容性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --lib
      - run: cargo check --locked --lib --target wasm32-unknown-unknown

  # WebAssembly 构建
  build-wasm:
    name: WebAssembly 构建
    runs-on: ubuntu-latest
    needs: [check, msrv]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 安装 wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 编译 WASM 测试
        run: cargo check --locked --target wasm32-unknown-unknown --tests --verbose

      - name: 执行 JS 数据与选项回归测试
        run: wasm-pack test --node . --locked --lib --test test_data_regressions --test test_options_regressions

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chromedriver: true

      - name: 执行真实 DOM 回归测试
        run: wasm-pack test --headless --chromedriver "${{ steps.chrome.outputs.chromedriver-path }}" . --locked --test test_dom_regressions

      - name: 构建 WebAssembly 包
        run: wasm-pack build --target web --release

      - name: 检查包大小
        run: |
          echo "WebAssembly 文件大小:"
          ls -lh pkg/belobog_stellar_grid_bg.wasm

          PACKAGE_SIZE=$(stat -c%s pkg/belobog_stellar_grid_bg.wasm)
          echo "包大小: ${PACKAGE_SIZE} bytes"

          # WASM 文件大小限制调整为 2MB（包含 xlsx 支持后体积增大）
          if [ $PACKAGE_SIZE -gt 2048000 ]; then
            echo "⚠️ 警告: 包大小超过 2MB"
          else
            echo "✅ 包大小合理"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: pkg/
          retention-days: 30

  # 使用实际示例页和下载文件内容作为发布门禁
  browser-test:
    name: 浏览器测试
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装静态服务器和浏览器测试依赖
        run: |
          cargo install basic-http-server --locked
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: 执行浏览器 E2E
        run: pnpm --dir e2e exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  packages-check:
    name: 框架子包构建与回归
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建所有子包
        run: |
          for package in types react vue svelte solid worker; do
            pnpm --dir "packages/$package" install --frozen-lockfile
            pnpm --dir "packages/$package" run build
          done
      - name: 验证预览生命周期、类型与发布产物
        run: node --test packages/scripts/*.test.mjs

  # 发布到 npm
  publish-npm:
    name: 发布到 npm
    runs-on: ubuntu-latest
    needs: [check, build-wasm, browser-test, packages-check]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: 下载 WebAssembly 包
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 检查版本一致性
        run: |
          VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\/v//')
          echo "发布版本: $VERSION"

          # 检查 Cargo.toml 版本
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "❌ 版本不一致: Git=$VERSION, Cargo=$CARGO_VERSION"
            exit 1
          fi

          echo "✅ 版本一致性检查通过"

      - name: 准备发布
        working-directory: pkg
        run: |
          # 确保 package.json 存在
          if [ ! -f package.json ]; then
            echo "❌ pkg/package.json 不存在"
            exit 1
          fi

          # 显示包信息
          echo "📦 包信息:"
          cat package.json

          echo ""
          echo "📂 包内容:"
          ls -la

      - name: 发布到 npm
        working-directory: pkg
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 构建并发布子包
        run: |
          for package in types react vue svelte solid worker; do
            pnpm --dir "packages/$package" install --frozen-lockfile
            pnpm --dir "packages/$package" run build
          done
          STAGING_DIR="$RUNNER_TEMP/bsg-packages"
          node packages/scripts/prepare-publish.mjs "$STAGING_DIR"
          for package in types react vue svelte solid worker; do
            pnpm --dir "$STAGING_DIR/$package" publish --access public --no-git-checks
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布成功通知
        run: |
          VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\/v//')
          echo "🎉 成功发布 belobog-stellar-grid@$VERSION 到 npm!"
          echo "📦 https://www.npmjs.com/package/belobog-stellar-grid"

  # 创建 GitHub Release
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: [check, build-wasm, browser-test, packages-check]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📌 版本号: $VERSION"

      - name: 从 CHANGELOG.md 提取发布说明
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 提取对应版本的内容（两个 ## [ 标题之间，或到文件末尾）
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "⚠️ 未在 CHANGELOG.md 中找到版本 $VERSION 的记录，使用默认说明"
            NOTES="发布版本 v${VERSION}"
          fi

          # 写入多行输出
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: pkg/

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            pkg/belobog_stellar_grid_bg.wasm
            pkg/belobog_stellar_grid.js
            pkg/belobog_stellar_grid.d.ts
